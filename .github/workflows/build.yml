name: Build APK

# 推送到 main 分支时自动编译，并把 APK 发布到 Releases 页面。
# 也可以在 Actions 页面手动点 "Run workflow" 重新编译。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check words.json
        run: python3 -c "import json;d=json.load(open('web/words.json',encoding='utf-8'));w=d['words'];ids=[x['id'] for x in w];assert len(ids)==len(set(ids)),'duplicate id';print(len(w),'words OK')"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release signing key"
          else
            echo "::warning::KEYSTORE_B64 secret not set — APK is signed with a throwaway debug key and will NOT be published as a release"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # 把错误原因写成注释，在 Actions 页面顶部直接可见
            msg=$(grep -A10 "What went wrong" build.log | head -12 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg:-see log}"
            exit 1
          fi

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::APK not found at $APK: $(ls app/build/outputs/apk/release/ 2>&1 | tr '\n' ' ')"; exit 1; }
          # 用 Python 读 zip，避免依赖 runner 上是否装了 unzip
          python3 - "$APK" <<'PY' || exit 1
          import sys, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          need = ["assets/index.html", "assets/words.json",
                  "assets/fonts/newsreader-latin-400-normal.woff2",
                  "assets/fonts/jetbrains-mono-latin-400-normal.woff2"]
          missing = [n for n in need if n not in names]
          if missing:
              sample = " ".join(sorted(n for n in names if n.startswith("assets"))[:15])
              print(f"::error title=APK contents::missing {missing}; assets present: {sample or 'none'}")
              sys.exit(1)
          print("::notice title=APK contents::all web assets present (%d entries)" % len(names))
          PY
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          if [ -x "${BT}apksigner" ]; then
            if "${BT}apksigner" verify --print-certs "$APK" > certs.txt 2>&1; then
              echo "::notice title=Signer::$(grep -m1 'certificate SHA-256' certs.txt) | $(grep -m1 'certificate DN' certs.txt)"
            else
              echo "::error title=apksigner::$(head -5 certs.txt | tr '\n' ' ')"; exit 1
            fi
          else
            echo "::warning::apksigner not found (build-tools dir: ${BT:-none})"
          fi
          if [ -x "${BT}aapt2" ]; then
            echo "::notice title=Package::$("${BT}aapt2" dump badging "$APK" 2>&1 | grep -E '^(package|sdkVersion|targetSdkVersion|application-label:)' | tr '\n' ' ')"
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/esp_vocab-v1.0.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: esp_vocab-v1.0.${{ github.run_number }}
          path: out/*.apk

      # 只有用正式密钥签名的包才发布，避免装上临时签名的版本后无法覆盖升级
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 西语词汇 v1.0.${{ github.run_number }}
          body: |
            自动编译自 ${{ github.sha }}。
            下载下面的 .apk 文件，在手机上安装即可（新版本可以直接覆盖安装，学习进度会保留）。
          files: out/*.apk
          make_latest: true
